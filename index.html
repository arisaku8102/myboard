<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級作業登記大師 (雲端同步版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Vue -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- 引入 Firebase 雲端資料庫工具 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  
  <style>
    .status-missing { @apply bg-red-500 text-white; }
    .status-uncorrected { @apply bg-orange-400 text-white; }
    .status-submitted { @apply bg-blue-400 text-white; }
    .status-completed { @apply bg-green-500 text-white; }
    .status-na { @apply bg-gray-200 text-gray-500; }
  </style>
</head>
<body class="bg-gray-50 font-sans p-4">
  <div id="app" class="max-w-7xl mx-auto">
    
    <!-- 頂部導覽列 -->
    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow border-t-4 border-indigo-500">
      <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
        📝 班級作業管理平台 <span class="text-sm bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full">☁️ 雲端同步連線中</span>
      </h1>
      <div class="flex gap-4">
        <button @click="currentView = 'teacher'" 
                :class="currentView === 'teacher' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'"
                class="px-6 py-2 rounded-lg font-bold transition">
          👨‍🏫 教師登記端
        </button>
        <button @click="currentView = 'board'" 
                :class="currentView === 'board' ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'"
                class="px-6 py-2 rounded-lg font-bold transition">
          📺 黑板展示端
        </button>
      </div>
    </div>

    <!-- 教師登記端 -->
    <div v-if="currentView === 'teacher'" class="bg-white p-6 rounded-lg shadow">
      <div class="mb-4 flex gap-4">
        <button @click="addTask" class="bg-green-100 text-green-700 px-4 py-2 rounded font-bold hover:bg-green-200">+ 新增作業/回條</button>
        <button @click="addStudent" class="bg-blue-100 text-blue-700 px-4 py-2 rounded font-bold hover:bg-blue-200">+ 新增學生</button>
        <button @click="resetToDefaultList" class="bg-red-100 text-red-700 px-4 py-2 rounded font-bold hover:bg-red-200 text-sm">
          ⚠️ 載入預設名單(重置)
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full border-collapse">
          <thead>
            <tr class="bg-gray-100">
              <th class="border p-3 text-left w-40">座號/姓名</th>
              <th v-for="task in tasks" :key="task.id" class="border p-3 min-w-[120px]">
                <input v-model="task.name" class="bg-transparent font-bold text-center w-full focus:outline-blue-500" placeholder="作業名稱">
                <button @click="removeTask(task.id)" class="text-red-500 text-sm mt-1 hover:text-red-700">刪除欄位</button>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="student in students" :key="student.id" class="hover:bg-gray-50">
              <td class="border p-3">
                <div class="flex justify-between items-center">
                  <input v-model="student.name" class="w-full font-bold focus:outline-blue-500" placeholder="學生姓名">
                  <button @click="removeStudent(student.id)" class="text-red-500 text-sm ml-2 hover:text-red-700" title="刪除學生">✖</button>
                </div>
              </td>
              <td v-for="task in tasks" :key="task.id" class="border p-2 text-center">
                <select v-model="records[student.id + '_' + task.id]" 
                        :class="'w-full p-2 rounded font-bold cursor-pointer ' + getStatusClass(records[student.id + '_' + task.id])">
                  <option value="missing">🔴 未交</option>
                  <option value="uncorrected">🟠 未訂正</option>
                  <option value="submitted">🔵 已繳交</option>
                  <option value="completed">🟢 已完成</option>
                  <option value="na">⚪ 無此項目</option>
                </select>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 黑板展示端 -->
    <div v-if="currentView === 'board'" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div v-for="student in sortedStudentsForBoard" :key="student.id" 
           :class="getCardStyle(student.id)"
           class="border-4 rounded-xl p-5 shadow-lg transition-all duration-500 transform hover:scale-105 bg-white">
        
        <h2 class="text-3xl font-black mb-4 text-center">{{ student.name }}</h2>
        
        <div v-if="studentStatus(student.id).badCount === 0" class="text-center py-4">
          <div class="text-6xl mb-2">✨🏆✨</div>
          <p class="text-xl font-bold text-green-700">任務全數通關！</p>
        </div>

        <div v-else>
          <ul class="space-y-2">
            <li v-for="issue in studentStatus(student.id).issues" :key="issue.taskId" 
                :class="issue.status === 'missing' ? 'bg-red-100 text-red-800' : 'bg-orange-100 text-orange-800'"
                class="p-2 rounded text-lg font-bold flex justify-between">
              <span>{{ issue.taskName }}</span>
              <span>{{ issue.status === 'missing' ? '🚨 未交' : '✍️ 未訂正' }}</span>
            </li>
          </ul>
        </div>
      </div>
    </div>

  </div>

  <script>
    // 💡 老師，請將您在 Firebase 申請到的金鑰貼在下方這個區塊：
    // (把底下整個 firebaseConfig 換掉)
    const firebaseConfig = {
      apiKey: "AIzaSyBKZmtsbfwGLhMpuIASlWW-NSbG4d64ORA",
      authDomain: "classboard-ccad4.firebaseapp.com",
      databaseURL: "https://classboard-ccad4-default-rtdb.firebaseio.com",
      projectId: "classboard-ccad4",
      storageBucket: "classboard-ccad4.firebasestorage.app",
      messagingSenderId: "845649968643",
      appId: "1:845649968643:web:b356f2f67bd6ced7669836",
      measurementId: "G-PJJCCC18B1"
    };

    // 啟動 Firebase 雲端資料庫
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const { createApp, ref, computed, watch, onMounted, nextTick } = Vue;

    createApp({
      setup() {
        const currentView = ref('teacher');
        
        const defaultStudents = [
          { id: 1, name: '1號 陳心甜' }, { id: 2, name: '2號 吳書宇' }, { id: 3, name: '3號 劉傑安' },
          { id: 4, name: '4號 黃詩叡' }, { id: 5, name: '5號 陳敬修' }, { id: 6, name: '6號 周嵩浩' },
          { id: 7, name: '7號 江恩頡' }, { id: 8, name: '8號 賴佑昇' }, { id: 9, name: '9號 郭展睿' },
          { id: 10, name: '10號 廖書毅' }, { id: 11, name: '11號 蔡依恩' }, { id: 12, name: '12號 黃貞芸' },
          { id: 13, name: '13號 李羽芯' }, { id: 14, name: '14號 范羽萱' }, { id: 15, name: '15號 劉馨棠' }, 
          { id: 16, name: '16號 陸禹均' }, { id: 17, name: '17號 黃曉恩' }, { id: 18, name: '18號 葉芯伃' }
        ];

        const students = ref([]);
        const tasks = ref([]);
        const records = ref({});
        let isReceivingCloudData = false; // 判斷是否為雲端傳來的資料，避免無限迴圈

        // 監聽雲端資料庫的變化 (當 A 電腦修改，B 電腦就會透過這裡自動更新)
        onMounted(() => {
          db.ref('classData').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
              isReceivingCloudData = true;
              students.value = data.students || [];
              tasks.value = data.tasks || [];
              records.value = data.records || {};
              // 更新完畫面後，解除鎖定
              nextTick(() => { isReceivingCloudData = false; });
            } else {
              // 如果雲端是空的(第一次用)，就把預設名單丟上去
              students.value = [...defaultStudents];
              tasks.value = [
                { id: 't1', name: '國語習作' },
                { id: 't2', name: '數學習作' },
                { id: 't3', name: '聯絡簿' }
              ];
            }
          });
        });

        // 只要老師在畫面上點擊修改，就會自動把資料上傳到雲端
        const syncToCloud = () => {
          if (isReceivingCloudData) return; // 如果是雲端傳過來的，就不需要再傳回去
          
          db.ref('classData').set({
            students: students.value,
            tasks: tasks.value,
            records: records.value
          });
        };

        // 監聽畫面的任何變更，觸發上傳
        watch([students, tasks, records], syncToCloud, { deep: true });

        const resetToDefaultList = () => {
          if(confirm('這會載入預設名單並同步到雲端，確定要載入嗎？')) {
            students.value = [...defaultStudents];
          }
        };

        const addStudent = () => { students.value.push({ id: Date.now(), name: '新學生' }); };
        const removeStudent = (id) => {
          if(confirm('確定要刪除這位學生嗎？')) {
            students.value = students.value.filter(s => s.id !== id);
          }
        };

        const addTask = () => { tasks.value.push({ id: 't' + Date.now(), name: '新任務' }); };
        const removeTask = (id) => {
          if(confirm('確定要刪除這個作業欄位嗎？')) {
            tasks.value = tasks.value.filter(t => t.id !== id);
          }
        };

        const getStatusClass = (status) => {
          const map = { 'missing': 'status-missing', 'uncorrected': 'status-uncorrected', 'submitted': 'status-submitted', 'completed': 'status-completed', 'na': 'status-na' };
          return map[status] || 'bg-gray-100 text-gray-800'; 
        };

        const studentStatus = (studentId) => {
          let issues = [];
          tasks.value.forEach(task => {
            const status = records.value[studentId + '_' + task.id] || 'missing'; 
            if (status === 'missing' || status === 'uncorrected') {
              issues.push({ taskId: task.id, taskName: task.name, status: status });
            }
          });
          return { issues, badCount: issues.length };
        };

        const getCardStyle = (studentId) => {
          const count = studentStatus(studentId).badCount;
          if (count >= 3) return 'border-red-600 bg-red-50'; 
          if (count > 0) return 'border-orange-400 bg-orange-50'; 
          return 'border-green-500 bg-green-50'; 
        };

        const sortedStudentsForBoard = computed(() => {
          return [...students.value].sort((a, b) => {
            return studentStatus(b.id).badCount - studentStatus(a.id).badCount;
          });
        });

        return { 
          currentView, students, tasks, records, 
          addStudent, removeStudent, addTask, removeTask, 
          getStatusClass, studentStatus, getCardStyle, sortedStudentsForBoard,
          resetToDefaultList
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
